[project]
name = "labeler-worker"
version = "0.1.0"
description = "Queue consumer: takes postings from labels-live / labels-backfill and labels them"
requires-python = ">=3.12"
dependencies = ["labeler-core"]

[tool.uv.sources]
labeler-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labeler_worker"]
