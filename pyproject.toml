# uv workspace: three Python packages, one lock file, one dev environment (.venv at the root).
#
#   core/     labeler         shared: labeling agent, policy, evidence, DB, queue, storage, LLM, services
#   backend/  labeler_api     HTTP API + analyst UI host        (depends on core)
#   worker/   labeler_worker  queue consumer, its own service   (depends on core)
#
# scripts/ (data, eval, distillation, Postman) and tests/ run from this root against all three.
[project]
name = "policy-labeler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["labeler-core", "labeler-api", "labeler-worker"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto[s3,sqs,secretsmanager]>=5.0",
    "pytest>=9.2.0",
    "testcontainers>=4.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "backend", "worker"]

[tool.uv.sources]
labeler-core = { workspace = true }
labeler-api = { workspace = true }
labeler-worker = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "ASYNC", "BLE", "RUF"]
# str+Enum keeps JSON/SQLite values plain strings; StrEnum would change repr in stored traces.
ignore = ["UP042", "E501"]  # long lines: left to `ruff format`; the rest are SQL/regex literals

[tool.ruff.lint.isort]
known-first-party = ["labeler", "labeler_api", "labeler_worker", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "RUF001"]  # pytest asserts; curly quotes are test data
"core/labeler/labeling/evidence.py" = ["RUF001"]  # curly quotes and dashes are what normalisation maps
"scripts/**" = ["S101"]
"scripts/postman_collection.py" = ["S101", "RUF001"]  # en dashes and × in API descriptions

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = ["core", "backend", "worker"]
