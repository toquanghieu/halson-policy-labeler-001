name: ci

on:
  push:
  pull_request:

jobs:
  python: # core/, backend/, worker/: one uv workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: lint
        run: uvx ruff check . && uvx ruff format --check .
      - name: types
        run: uvx mypy core/labeler backend/labeler_api worker/labeler_worker
      - name: tests (no API key; scripted model)
        run: uv run --with pytest-cov pytest -q --cov=labeler --cov=labeler_api --cov=labeler_worker --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t policy-labeler-api .
      - run: docker build -f worker/Dockerfile -t policy-labeler-worker .
