# pre-commit install   # once; then these run on every commit
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks # refuses commits that contain API keys or other secrets

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1024] # keeps data/ dumps out of git

  # Same tools and versions as `make lint` and CI, resolved by uv / npm from the project.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + format)
        entry: bash -c 'uvx ruff check --fix . && uvx ruff format .'
        language: system
        files: ^(core|backend|worker|scripts|tests)/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash -c 'uvx mypy core/labeler backend/labeler_api worker/labeler_worker'
        language: system
        files: ^(core|backend|worker)/.*\.py$
        pass_filenames: false
      - id: eslint
        name: eslint + tsc
        entry: bash -c 'cd frontend && npx eslint . && npx tsc -b'
        language: system
        files: ^frontend/src/
        pass_filenames: false
