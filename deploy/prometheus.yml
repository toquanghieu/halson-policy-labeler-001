global:
  scrape_interval: 10s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  # One target per worker replica: Docker's DNS returns every container behind the name.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100

rule_files: ["/etc/prometheus/alerts.yml"]
