# ElasticMQ: an SQS-compatible queue for local runs. Same queues, visibility timeout and
# redrive policy (DLQ after 3 receives) as the SQS queues in DESIGN.md.
include classpath("application.conf")

# "*" = build queue URLs from the request's Host header, so both containers (elasticmq:9324)
# and processes on the host (localhost:9324) get URLs they can reach.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  labels-sync {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue { name = "labels-sync-dlq", maxReceiveCount = 3 }
  }
  labels-sync-dlq {}
  labels-live {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue { name = "labels-live-dlq", maxReceiveCount = 3 }
  }
  labels-live-dlq {}
  labels-backfill {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue { name = "labels-backfill-dlq", maxReceiveCount = 3 }
  }
  labels-backfill-dlq {}
}
